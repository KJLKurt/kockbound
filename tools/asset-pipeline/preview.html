<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knockbound · Character pipeline proof</title>
<style>body{margin:0;background:#132639;color:#f5ecdb;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;left:28px;top:20px;max-width:430px}h1{font-size:25px;margin:0 0 5px}p{line-height:1.5;margin:6px 0;color:#c2d3df}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,select{background:#28495f;border:1px solid #608494;border-radius:8px;color:white;padding:9px 13px;cursor:pointer}#status{font-size:13px}footer{position:absolute;bottom:18px;left:28px;font-size:13px;color:#b7cdd9}</style>
<style>header{background:rgba(19,38,57,.94);padding:16px;border-radius:12px}footer{background:rgba(19,38,57,.94);padding:8px 12px;border-radius:8px}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<header><h1>Knockbound / Sprout</h1><p>One base character · pipeline prototype r001</p><nav><select id="clip" aria-label="Animation"><option value="rest">Rest pose</option></select><button id="view">Gameplay view</button><button id="rotate">Turntable</button><button id="theme">Light floor</button><button id="pause">Pause</button></nav><p id="status">Loading GLB…</p></header><footer>Drag to orbit · wheel to zoom · 1 grid square = 1 metre · cyan ring = simulation radius 0.45 m</footer>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#132639');
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(3.2,2.2,4.8);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.update();
scene.add(new T.HemisphereLight(0xddefff,0x536171,2));
const key=new T.DirectionalLight(0xffe5cd,3);key.position.set(-3,5,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const rim=new T.DirectionalLight(0x6bcdea,2);rim.position.set(3,3,-3);scene.add(rim);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#1c3549',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;floor.receiveShadow=true;scene.add(floor);
const grid=new T.GridHelper(12,12,0x4b7482,0x294754);grid.position.y=.001;scene.add(grid);
const ring=new T.Mesh(new T.RingGeometry(.44,.45,64),new T.MeshBasicMaterial({color:0x62dbea,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.004;scene.add(ring);
const arrow=new T.ArrowHelper(new T.Vector3(0,0,1),new T.Vector3(0,.01,.5),.55,0x62dbea,.16,.10);scene.add(arrow);
let gltf,mixer,rotate=false,paused=false,gameplay=false,light=false,clock=new T.Clock();const status=document.querySelector('#status');
try {
 gltf=await new GLTFLoader().loadAsync('/sprout-prototype.glb');scene.add(gltf.scene);mixer=new T.AnimationMixer(gltf.scene);
 gltf.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
 for(const a of gltf.animations){const option=document.createElement('option');option.value=a.name;option.textContent=a.name;document.querySelector('#clip').append(option);}
 const meta=await (await fetch('/asset.json')).json();status.textContent=`Loaded · ${meta.triangles.toLocaleString()} triangles · ${meta.materials} materials · ${(meta.bytes/1024).toFixed(0)} KiB · ${gltf.animations.length} clips`;
 document.querySelector('header p').textContent=`One base character · ${meta.revision==='r002'?'refined prototype':'pipeline prototype'} ${meta.revision}`;
 window.assetPreview={status:'loaded',clips:gltf.animations.map(a=>a.name),renderer:renderer.info,scene:gltf.scene,mixer};
} catch(e){status.textContent='FAILED: '+e.message;window.assetPreview={status:'failed',error:e.message};throw e;}
document.querySelector('#clip').onchange=e=>{mixer.stopAllAction();gltf.scene.traverse(o=>{if(o.isSkinnedMesh)o.skeleton.pose();});const clip=gltf.animations.find(c=>c.name===e.target.value);if(clip)mixer.clipAction(clip).reset().play();};
document.querySelector('#view').onclick=()=>{gameplay=!gameplay;camera.position.set(...(gameplay?[6,10,8]:[3.2,2.2,4.8]));controls.target.set(0,gameplay?0:1,0);controls.update();};
document.querySelector('#rotate').onclick=()=>{rotate=!rotate;};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};
document.querySelector('#theme').onclick=()=>{light=!light;scene.background.set(light?'#dae2de':'#132639');floor.material.color.set(light?'#b7c9c8':'#1c3549');};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer&&!paused)mixer.update(dt);if(gltf&&rotate)gltf.scene.rotation.y+=dt*.35;renderer.render(scene,camera);}frame();
</script></html>
